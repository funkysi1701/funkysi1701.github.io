name: 30-day issue schedule

# Thin caller — implementation lives in funkysi1701/repo-automation@v1
# Custom prompt + content-suggestion slots; self-hosted k8s runners.
# Docs: https://github.com/funkysi1701/repo-automation

on:
  schedule:
    # Mondays 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print schedule body without creating/updating the GitHub issue
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  models: read

jobs:
  plan:
    uses: funkysi1701/repo-automation/.github/workflows/issue-schedule.yml@v1
    secrets: inherit
    with:
      dry_run: ${{ inputs.dry_run || false }}
      pr_base_branch: develop
      prompt_file: .github/issue-schedule-prompt.md
      content_suggestion_prefix: "[Content Suggestion]:"
      runs_on: '["self-hosted", "k8s"]'
