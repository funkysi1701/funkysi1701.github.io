name: Reusable Playwright E2E

on:
  workflow_call:
    inputs:
      base_url:
        description: BASE_URL for Playwright tests
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  playwright:
    # Host runner, not the Playwright Jammy image. That image's git (GnuTLS)
    # fails actions/checkout on this cluster:
    # gnutls_handshake() failed: Error in the pull function.
    # Host checkout already works for the other k8s jobs, including smoke.
    runs-on: [self-hosted, k8s]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: "Check Playwright // spec: headers"
        run: npm run check:spec-headers

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          # Self-hosted images may ship a NodeSource apt source that 403s and
          # breaks apt-get update inside `playwright install --with-deps`.
          sudo rm -f /etc/apt/sources.list.d/nodesource* \
            /etc/apt/sources.list.d/*nodesource*.list \
            /etc/apt/sources.list.d/*nodesource*.sources 2>/dev/null || true
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '/deb\.nodesource\.com/d' /etc/apt/sources.list || true
          fi
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.base_url }}
          CI: "true"

      - name: Generate page coverage
        if: always()
        run: node scripts/generate-page-coverage.js

      - name: Upload page coverage to Codecov
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CODECOV_TOKEN:-}" ]; then
            echo "CODECOV_TOKEN not set; skipping Codecov upload."
            exit 0
          fi
          curl -sSfL https://uploader.codecov.io/latest/linux/codecov -o codecov
          chmod +x codecov
          ./codecov -t "$CODECOV_TOKEN" -f ./coverage/page-coverage.lcov -F page-coverage -n page-coverage || true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
