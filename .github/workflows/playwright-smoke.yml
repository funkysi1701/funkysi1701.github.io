# PR smoke subset of Playwright against a local Hugo server (tests PR changes).
# Full E2E remains on swa-deploy-nonprod.yml (blog-dev) and playwright.yml (production).
# Decision for issue #3275: GHA smoke on PRs, not contributor-only local tests.

name: Playwright smoke (PR)

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, k8s]
    # Setup (checkout + apt --with-deps + Chromium + Hugo image) is ~7–9 min on ARC;
    # successful runs land near 9 min, so 10 was too tight under cluster variance.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Load Hugo version
        run: |
          echo "HUGO_VERSION=$(grep HUGO_VERSION .env | cut -d '=' -f2)" >> $GITHUB_ENV

      - uses: ./.github/actions/install-libatomic

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          # Self-hosted images may ship a NodeSource apt source that 403s and
          # breaks apt-get update inside `playwright install --with-deps`.
          sudo rm -f /etc/apt/sources.list.d/nodesource* \
            /etc/apt/sources.list.d/*nodesource*.list \
            /etc/apt/sources.list.d/*nodesource*.sources 2>/dev/null || true
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '/deb\.nodesource\.com/d' /etc/apt/sources.list || true
          fi
          # Ephemeral ARC pods still need OS deps each job; browser binaries
          # hit the cache above when the Playwright version is unchanged.
          npx playwright install --with-deps chromium

      - name: Start Hugo server
        run: |
          docker run -d --name hugo-smoke \
            -p 1313:1313 \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            -u "$(id -u):$(id -g)" \
            "floryn90/hugo:${HUGO_VERSION}-ext-alpine" \
            server --environment production -p 1313 --bind 0.0.0.0 \
            --baseURL http://127.0.0.1:1313/ \
            --disableLiveReload --disableFastRender --noBuildLock

      - name: Wait for Hugo
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:1313/" >/dev/null; then
              echo "Hugo ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Hugo did not become ready in time"
          docker logs hugo-smoke || true
          exit 1

      - name: Run Playwright smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: http://127.0.0.1:1313
          CI: "true"
      - name: Stop Hugo server
        if: always()
        run: docker rm -f hugo-smoke || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-smoke-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
