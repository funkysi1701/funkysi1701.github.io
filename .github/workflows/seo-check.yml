name: SEO Check (manual)

permissions:
  contents: read

# Prefer the post-deploy SEO job in swa-deploy-nonprod.yml. This workflow remains for manual runs.
on:
  workflow_dispatch:

jobs:
  seo-crawl:
    uses: ./.github/workflows/reusable-seo-check.yml
    secrets:
      SIGNALDIFF_API_BASE_URL: ${{ secrets.SIGNALDIFF_API_BASE_URL }}
      SIGNALDIFF_CI_API_KEY: ${{ secrets.SIGNALDIFF_CI_API_KEY }}
