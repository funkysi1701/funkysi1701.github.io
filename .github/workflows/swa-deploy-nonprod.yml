# Non-production Azure Static Web Apps deploy + post-deploy checks.
#
# Branch gates:
#   develop      → blog-dev + blog-test, then Playwright + SEO against blog-dev
#   feature/**   → blog-dev only, then Playwright + SEO against blog-dev
#   workflow_dispatch → same gates based on the ref that triggered the run
#
# Build/upload (Hugo env, --buildFuture on development, staticwebapp.config.json,
# sitemap wait) live in reusable-hugo-swa-deploy.yml.
#
# Required secrets:
#   AZURE_STATIC_WEB_APPS_API_TOKEN_BLOG_DEV
#   AZURE_STATIC_WEB_APPS_API_TOKEN_BLOG_TEST  (develop only; unused on feature/*)
#   SIGNALDIFF_API_BASE_URL, SIGNALDIFF_CI_API_KEY (SEO job)
#   CODECOV_TOKEN (optional; Playwright page-coverage upload)
name: Deploy to Dev and Test SWA

permissions:
  contents: read

# One in-flight run per ref; newer pushes cancel superseded deploys.
concurrency:
  group: swa-deploy-nonprod-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - "feature/**"

jobs:
  # Always: development Hugo env → blog-dev.funkysi1701.com (--buildFuture).
  deploy-dev:
    name: Deploy blog-dev
    uses: ./.github/workflows/reusable-hugo-swa-deploy.yml
    with:
      hugo_environment: development
      github_environment: Dev
      wait_sitemap_url: https://blog-dev.funkysi1701.com/sitemap.xml
    secrets:
      azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLOG_DEV }}

  # develop only: staging Hugo env → blog-test.funkysi1701.com (no --buildFuture).
  deploy-test:
    name: Deploy blog-test
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/reusable-hugo-swa-deploy.yml
    with:
      hugo_environment: staging
      github_environment: Test
      wait_sitemap_url: https://blog-test.funkysi1701.com/sitemap.xml
    secrets:
      azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLOG_TEST }}

  # Full E2E against the freshly deployed blog-dev (not blog-test).
  playwright-dev:
    name: Playwright (blog-dev)
    needs: deploy-dev
    if: always() && needs.deploy-dev.result == 'success'
    uses: ./.github/workflows/reusable-playwright.yml
    with:
      base_url: https://blog-dev.funkysi1701.com
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Signal Diff crawl of blog-dev sitemap after a successful deploy.
  seo-check-dev:
    name: SEO check (blog-dev)
    needs: deploy-dev
    if: always() && needs.deploy-dev.result == 'success'
    uses: ./.github/workflows/reusable-seo-check.yml
    secrets:
      SIGNALDIFF_API_BASE_URL: ${{ secrets.SIGNALDIFF_API_BASE_URL }}
      SIGNALDIFF_CI_API_KEY: ${{ secrets.SIGNALDIFF_CI_API_KEY }}
