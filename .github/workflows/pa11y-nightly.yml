name: Pa11y nightly accessibility

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

# Build the scanner image on GitHub-hosted runners (reliable Docker Hub), push to GHCR,
# then scan on ARC. Avoids multi-hour hangs pulling node:20-bookworm on self-hosted k8s.
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Image name
        id: image
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}/pa11y-scanner" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: scripts/pa11y-sitemap
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=pa11y-scanner
          cache-to: type=gha,mode=max,scope=pa11y-scanner

  pa11y:
    needs: image
    runs-on: [self-hosted, k8s]
    # Healthy full sitemap ≈ 45m; hard per-page timeouts + 90m scanner budget should finish well under this.
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for production site
        run: |
          set -euo pipefail
          SITE_URL="https://www.funkysi1701.com"
          READY=0
          for i in $(seq 1 36); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}/" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Public URL ready (HTTP 200): ${SITE_URL}/"
              READY=1
              break
            fi
            echo "Attempt $i: HTTP $HTTP_CODE; retrying in 5s..."
            sleep 5
          done
          if [ "$READY" -ne 1 ]; then
            echo "::warning::No HTTP 200 from ${SITE_URL}/ after ~180s; running Pa11y anyway."
          fi

      - name: Pull Pa11y scanner image
        id: pull
        env:
          PA11Y_IMAGE: ${{ needs.image.outputs.image }}
          PA11Y_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${PA11Y_IMAGE}" ] || [ -z "${PA11Y_DIGEST}" ]; then
            echo "::error::Missing GHCR image ref from image job (image='${PA11Y_IMAGE}' digest='${PA11Y_DIGEST}')."
            exit 1
          fi
          REF="${PA11Y_IMAGE}@${PA11Y_DIGEST}"
          echo "Pulling ${REF}"
          # Bound CloudFront/registry hangs; do not burn the 150m job timeout on a stuck pull.
          if ! timeout 10m docker pull "${REF}"; then
            echo "::error::Failed to pull Pa11y scanner image from GHCR within 10m: ${REF}"
            exit 1
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Run Pa11y full sitemap scan
        id: pa11y
        env:
          PA11Y_IMAGE_REF: ${{ steps.pull.outputs.ref }}
        run: |
          set +e
          PA11Y_RUN_FAILED=0
          PA11Y_JOB_SHOULD_FAIL=0
          SITE_URL="https://www.funkysi1701.com"
          PA11Y_RUNNERS_VAL="${PA11Y_NIGHTLY_RUNNERS:-axe,htmlcs}"
          PA11Y_MAX_PAGES_VAL="${PA11Y_NIGHTLY_MAX_PAGES:-}"
          : > pa11y-error.log

          # Tee stderr so progress appears in the job log (and we keep a file for post-checks).
          # Image has Chromium + npm deps; only bind-mount scan.mjs + pipeline config from the repo.
          docker run --rm --cap-add=SYS_ADMIN --shm-size=2g \
            -e "SITE_URL=$SITE_URL" \
            -e "PA11Y_MAX_PAGES=$PA11Y_MAX_PAGES_VAL" \
            -e "PA11Y_RUNNERS=$PA11Y_RUNNERS_VAL" \
            -e "PA11Y_WAIT_MS=${PA11Y_WAIT_MS:-}" \
            -e "PA11Y_TIMEOUT_MS=${PA11Y_TIMEOUT_MS:-}" \
            -e "PA11Y_HARD_TIMEOUT_MS=${PA11Y_HARD_TIMEOUT_MS:-}" \
            -e "PA11Y_MAX_DURATION_MS=${PA11Y_MAX_DURATION_MS:-}" \
            -e "PA11Y_THEMES=${PA11Y_THEMES:-light,dark}" \
            -e "PA11Y_CONFIG=/config/pa11y.json" \
            -v "${{ github.workspace }}/scripts/pa11y-sitemap/scan.mjs:/opt/pa11y-runner/scan.mjs:ro" \
            -v "${{ github.workspace }}/scripts/pa11y-pipeline.json:/config/pa11y.json:ro" \
            "${PA11Y_IMAGE_REF}" \
            > pa11y-results.json 2> >(tee -a pa11y-error.log >&2)
          PA11Y_EXIT=$?
          set -e

          # Exit 0 = clean; 2 = a11y errors found (scan completed). Anything else is infra/incomplete.
          if [ "$PA11Y_EXIT" -eq 0 ]; then
            :
          elif [ "$PA11Y_EXIT" -eq 2 ]; then
            echo "Pa11y completed with accessibility findings (exit 2); filing issues."
          else
            echo "::error::Pa11y failed with exit code $PA11Y_EXIT"
            PA11Y_JOB_SHOULD_FAIL=1
            # Keep usable JSON (e.g. hard-timeout skip / overall budget truncate) so issues can still be filed.
            if [ ! -s pa11y-results.json ] || ! node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('pa11y-results.json','utf8')); if(!Array.isArray(j)) process.exit(1)"; then
              echo "[]" > pa11y-results.json
              PA11Y_RUN_FAILED=1
            else
              echo "::warning::Scan exit $PA11Y_EXIT but pa11y-results.json is usable; filing issues from available findings."
            fi
          fi

          if grep -qiE 'i/o timeout|failed to copy|Unable to find image|error pulling|dial tcp' pa11y-error.log 2>/dev/null; then
            echo "::error::Container/registry error detected in pa11y-error.log"
            PA11Y_RUN_FAILED=1
            PA11Y_JOB_SHOULD_FAIL=1
          fi

          echo "pa11y_run_failed=$PA11Y_RUN_FAILED" >> "$GITHUB_OUTPUT"
          echo "pa11y_job_should_fail=$PA11Y_JOB_SHOULD_FAIL" >> "$GITHUB_OUTPUT"

      - name: Upload Pa11y logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pa11y-nightly-${{ github.run_id }}
          path: |
            pa11y-error.log
            pa11y-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub issues for new violations
        if: always() && hashFiles('pa11y-results.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_NUMBER: ${{ github.run_number }}
          PA11Y_RUN_FAILED: ${{ steps.pa11y.outputs.pa11y_run_failed }}
          PA11Y_RESULTS_PATH: ${{ github.workspace }}/pa11y-results.json
          SITE_URL: https://www.funkysi1701.com
        run: node scripts/create-accessibility-issues.js

      - name: Fail on Pa11y infrastructure or incomplete scan
        if: always()
        env:
          PA11Y_RUN_FAILED: ${{ steps.pa11y.outputs.pa11y_run_failed }}
          PA11Y_JOB_SHOULD_FAIL: ${{ steps.pa11y.outputs.pa11y_job_should_fail }}
        run: |
          set -euo pipefail
          FAILED=0
          if [ "${PA11Y_RUN_FAILED:-}" = "1" ] || [ "${PA11Y_JOB_SHOULD_FAIL:-}" = "1" ]; then
            echo "::error::Pa11y nightly failed (infra, incomplete scan, or registry/container error). See pa11y-error.log artifact."
            FAILED=1
          fi
          if [ -f pa11y-error.log ] && grep -q 'ERR_CONNECTION_REFUSED' pa11y-error.log; then
            echo "::error::Site was unreachable during Pa11y (ERR_CONNECTION_REFUSED)."
            FAILED=1
          fi
          if [ -f pa11y-error.log ] && grep -qiE 'i/o timeout|failed to copy|Unable to find image|error pulling' pa11y-error.log; then
            echo "::error::Docker/registry failure during Pa11y."
            FAILED=1
          fi
          # Pull step failure leaves outputs empty; still fail the job.
          if [ "${{ steps.pull.outcome }}" != "success" ]; then
            echo "::error::Pa11y scanner image pull did not succeed."
            FAILED=1
          fi
          exit "$FAILED"
