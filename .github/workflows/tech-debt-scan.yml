name: Tech debt scan

# Thin caller — implementation lives in funkysi1701/repo-automation@v1
# Hugo hotspots/globs/prompt; self-hosted k8s runners; Fridays to stagger other jobs.
# Docs: https://github.com/funkysi1701/repo-automation

on:
  schedule:
    # Fridays 09:00 UTC (staggered from Mon issue-schedule + Wed blog-post-idea)
    - cron: '0 9 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print proposed issues without creating them
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  models: read

jobs:
  scan:
    uses: funkysi1701/repo-automation/.github/workflows/tech-debt-scan.yml@v1
    secrets: inherit
    with:
      dry_run: ${{ inputs.dry_run || false }}
      prompt_profile: generic
      prompt_file: .github/tech-debt-prompt.md
      hotspots_file: .github/tech-debt-hotspots.txt
      file_globs: >-
        layouts/**/*.html,
        assets/**/*.{scss,css,js},
        scripts/**/*.{js,mjs,py},
        tests/**/*.{ts,js},
        .github/workflows/*.yml,
        staticwebapp.config.json
      large_file_min_bytes: "15000"
      conventions: |
        Prefer root layouts/, assets/, static/ overrides over editing themes/hugo-theme-bootstrap/ (frozen HBS v0.65.1 fork; do not rebase onto upstream v1).
        Do not hand-edit parkrun generated block in content/parkrun.md; use scripts/update_parkrun_results.py.
        public/ is build output - not source of truth.
        Keep CI/docs (AGENTS.md, CONTRIBUTING.md, README, copilot-instructions, .cursor/rules) aligned when workflows change.
      runs_on: '["self-hosted", "k8s"]'
